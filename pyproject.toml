[project]
name = "process-design-suite"
version = "0.1.0"
description = "Chemical and environmental process design suite (WWTP module)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "Jinja2>=3.1", "PySide6>=6.6"]
license = { text = "Proprietary" }

[project.scripts]
processdesign = "processdesign.cli:main"

[project.gui-scripts]
processdesign-gui = "processdesign.gui.main_window:main"

[tool.setuptools.packages.find]
include = ["processdesign*"]

[tool.setuptools.package-data]
"processdesign.core" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
