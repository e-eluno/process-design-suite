name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, ubuntu-latest]   # macos-13 = Intel x86_64
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (GUI test uses real PySide6 here)
        run: python -m pytest -q

  build:
    name: Build installer (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            sep: ";"
          - os: macos-13
            sep: ":"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build app
        shell: bash
        run: >
          pyinstaller --noconfirm --name "Process Design Suite" --windowed
          --add-data "processdesign/core/data${{ matrix.sep }}processdesign/core/data"
          processdesign/gui/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: process-design-suite-${{ runner.os }}
          path: dist/
